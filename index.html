<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCA Statement Reader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2712.5%27 font-size=%2713%27%3E%F0%9F%8F%A6%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --ink:#16202E; --muted:#5D6B7C; --line:#D9DFE6;
  --brand:#14324F; --brand-ink:#FFFFFF; --ok:#0E7A63; --ok-bg:#DDF2EB;
  --warn:#9A5B00; --warn-bg:#FCEFD2; --bad:#B3261E; --bad-bg:#FBE2DF; --info:#245FA8; --info-bg:#E1ECF9; --dot:#14324F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --card:#17202B; --ink:#E6ECF2; --muted:#9AA9B9; --line:#2A3644;
    --brand:#0B2236; --brand-ink:#EAF1F8; --ok:#4CD0AE; --ok-bg:#12372E; --warn:#F2B64D; --warn-bg:#3A2D10;
    --bad:#FF8F86; --bad-bg:#402020; --info:#8DBAF0; --info-bg:#182B43; --dot:#8DBAF0;
  }
}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{background:var(--brand);color:var(--brand-ink);padding:14px 16px 0}
header h1{margin:0;font-size:20px;font-weight:600}
header p{margin:2px 0 10px;font-size:12.5px;opacity:.8}
.nav{display:flex;gap:2px;overflow-x:auto}
.nav button{border:0;background:none;color:var(--brand-ink);opacity:.7;padding:10px 14px;font:500 14px inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.nav button.on{opacity:1;border-bottom-color:#fff}
button,input,select{font-family:inherit}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--info);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;overflow:hidden}
.card h2{margin:0;padding:12px 14px;font-size:16.5px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
.card h2 small{font-weight:400;font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:48px}
.row:last-child{border-bottom:0}
.row .lab small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:1px}
.val{font-weight:600;font-size:16px;white-space:nowrap;text-align:right}
.neg{color:var(--bad)}
.valwrap{display:flex;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;min-height:34px;padding:0 12px;font-size:13px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--info);color:#fff;border-color:var(--info)}
.btn.sm{min-height:30px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.cp{margin-left:6px}
.cp.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:500}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.note{font-size:13px;color:var(--muted);padding:10px 14px;background:var(--bg);border-top:1px solid var(--line)}
.lead{font-size:14px;color:var(--muted);margin:2px 2px 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:1 0 auto;min-height:44px;padding:0 14px;border:0;background:none;color:var(--muted);font-size:14px;font-weight:500;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--info)}
.badge{margin-left:6px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:1px 7px;font-size:12px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sum b{display:block;font-size:19px;font-weight:600}
.sum span{font-size:12px;color:var(--muted)}
.thr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:0 2px 12px;flex-wrap:wrap}
.thr input,.fld{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:5px 8px;font-size:13.5px;min-height:34px}
.thr input{width:92px}
details.pos{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 12px;overflow:hidden}
details.pos[open]{border-color:var(--info)}
details.pos summary{list-style:none;cursor:pointer;padding:12px 14px;display:block}
details.pos summary::-webkit-details-marker{display:none}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ph b{font-size:16.5px}
.pm{font-size:13px;color:var(--muted);margin-top:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:4px 14px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;text-align:right}
.tl{padding:2px 14px 10px} .tl svg{display:block;width:100%;height:auto}
.lg{font-size:12px;color:var(--muted);margin-top:4px}
.sub{padding:8px 14px 4px;font-weight:600;font-size:13px}
.flag{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.flag:last-child{border-bottom:0}
.flag .pill{align-self:flex-start;margin-top:2px;white-space:nowrap}
.flag small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.drop{border:2px dashed var(--line);border-radius:12px;background:var(--card);padding:34px 16px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--info);background:var(--info-bg)}
.drop b{font-size:17px}
.fileitem{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.fileitem:last-child{border-bottom:0}
.fileitem small{color:var(--muted);display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--info);color:#fff;border-color:var(--info)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
#toast.on{opacity:1}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12.5px}
.err{color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1>MCA Statement Reader</h1>
  <p>Bank statement PDF daalo, MCA ka poora hisaab milega. PDF aapke browser ke andar hi padhi jaati hai, kahin upload nahi hoti.</p>
  <nav class="nav" id="nav"></nav>
</header>
<main id="main"><p class="lead">Load ho raha hai...</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/util.js"></script>
<script src="js/lenders_default.js"></script>
<script src="js/analyze.js"></script>
<script src="js/pdftext.js"></script>
<script src="js/api_local.js"></script>
<script src="js/banks/registry.js"></script>
<script src="js/ui.js"></script>
<script>
(async function boot(){
  MCA.BANK_ERRORS=[];
  for(const f of MCA.BANK_FILES){
    await new Promise(res=>{const s=document.createElement("script");s.src="js/banks/"+f+".js";s.onload=res;s.onerror=()=>{MCA.BANK_ERRORS.push(f+".js load nahi hui");res()};document.head.appendChild(s)});
  }
  window.startUI();
})();
</script>
</body>
</html>
